modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"
issueTrackerURL="https://github.com/ShrinkShi/Primal/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ShrinkShi"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
