side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="primal_core"
type="required"
versionRange="${internal_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="primal_progression"
type="required"
versionRange="${internal_version_range}"
ordering="AFTER"
side="BOTH"
