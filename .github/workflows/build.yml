name: Build

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Validate project graph
        run: ./gradlew --no-daemon projects

      - name: Build all modules
        run: ./gradlew --no-daemon buildAll
