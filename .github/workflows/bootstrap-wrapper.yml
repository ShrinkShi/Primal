name: Bootstrap Gradle Wrapper and validate

on:
  push:
    branches:
      - chore/bootstrap-neoforge-workspace
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download pinned official Gradle Wrapper JAR
        shell: bash
        run: |
          mkdir -p gradle/wrapper
          curl -fL "https://raw.githubusercontent.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/30cafee9cd8d7f46427ec88fa8579d49c146df9a/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          actual="$(git hash-object gradle/wrapper/gradle-wrapper.jar)"
          expected="1b33c55baabb587c669f562ae36f953de2481846"
          if [ "$actual" != "$expected" ]; then
            echo "Gradle Wrapper JAR Git blob SHA mismatch: $actual" >&2
            exit 1
          fi
          chmod +x gradlew

      - name: Validate Gradle project graph
        run: ./gradlew --no-daemon projects

      - name: Build all Primal modules
        run: ./gradlew --no-daemon buildAll

      - name: Commit official Gradle Wrapper JAR
        shell: bash
        run: |
          if git ls-files --error-unmatch gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar
          git commit -m "chore: 添加官方 Gradle Wrapper JAR"
          git push origin "HEAD:${GITHUB_REF_NAME}"
