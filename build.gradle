plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = primal_group
version = primal_version

def moduleDefinitions = [
        ':mods:core'       : [id: 'primal_core',        name: 'Primal Core',        description: 'Primal 系列模组共享 API、事件、标识与基础数据协议。'],
        ':mods:progression': [id: 'primal_progression', name: 'Primal Progression', description: '玩家等级、技能解锁与天赋框架适配层。'],
        ':mods:actions'    : [id: 'primal_actions',     name: 'Primal Actions',     description: '动作、潜行处决与第三方战斗/移动模组兼容层。'],
        ':mods:society'    : [id: 'primal_society',     name: 'Primal Society',     description: '部落、阵营、成员关系、职位、声望与外交规则。'],
        ':mods:settlement' : [id: 'primal_settlement',  name: 'Primal Settlement',  description: '聚落、族人劳动力与村庄系统的整合层。'],
        ':mods:warfare'    : [id: 'primal_warfare',     name: 'Primal Warfare',     description: '小队、RTS 指挥、士气、据点、区域控制与战争规则。']
]

ext.primalModules = moduleDefinitions

def primalProjects = moduleDefinitions.keySet().collect { project(it) }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// 所有统一 Dev Run 都会加载六个子项目的 SourceSet。
// 在全新克隆或执行 clean 后，这些 SourceSet 的 build/classes 与 build/resources 目录可能尚不存在。
// SecureJarHandler 会拒绝不存在的 Mod 路径，因此统一在启动前准备全部本地 Mod 输出。
def preparePrimalModOutputs = tasks.register('preparePrimalModOutputs') {
    group = 'ide'
    description = '为统一 NeoForge Dev Runtime 编译并处理全部 Primal 本地模组输出。'
    dependsOn(primalProjects.collect { "${it.path}:classes" })
}

// IDEA 生成的 Java/Gradle 运行配置会构建根 sourceSet 的 classes。
// 让根 classes 同样依赖全部本地 Mod，可保证直接点击 IDEA 的运行按钮时输出目录已经存在。
tasks.named('classes').configure {
    dependsOn(preparePrimalModOutputs)
}

// settings.gradle 会为 mods:* 自动创建中间父项目 :mods。
// 这里只配置真正产出 JAR 的六个叶子 Mod，避免把 :mods 误当成 NeoForge Mod。
configure(primalProjects) {
    def moduleDef = rootProject.ext.primalModules[project.path]

    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'net.neoforged.moddev'

    group = rootProject.primal_group
    version = rootProject.primal_version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    repositories {
        mavenCentral()
    }

    base {
        archivesName = moduleDef.id
    }

    sourceSets.main.resources {
        srcDir('src/generated/resources')
        exclude('**/*.bbmodel')
        exclude('src/generated/**/.cache')
    }

    neoForge {
        version = rootProject.neo_version

        parchment {
            mappingsVersion = rootProject.parchment_mappings_version
            minecraftVersion = rootProject.parchment_minecraft_version
        }

        validateAccessTransformers = true

        mods {
            "${moduleDef.id}" {
                sourceSet(sourceSets.main)
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        def replaceProperties = [
                minecraft_version      : rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                neo_version            : rootProject.neo_version,
                loader_version_range   : rootProject.loader_version_range,
                mod_id                 : moduleDef.id,
                mod_name               : moduleDef.name,
                mod_version            : rootProject.primal_version,
                mod_description        : moduleDef.description,
                internal_version_range : "[${rootProject.primal_version},)"
        ]
        inputs.properties(replaceProperties)
        filesMatching('META-INF/neoforge.mods.toml') {
            expand(replaceProperties)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes(
                    'Automatic-Module-Name': "io.github.shrinkshi.primal.${project.name.replace('-', '.')}"
            )
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    validateAccessTransformers = true

    runs {
        client {
            client()
            ideName = 'Primal - Client'
            gameDirectory = file('run/client')
            programArguments.addAll '--username', 'PrimalDev'
            systemProperty 'neoforge.enabledGameTestNamespaces', moduleDefinitions.values()*.id.join(',')
        }

        server {
            server()
            ideName = 'Primal - Dedicated Server'
            gameDirectory = file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', moduleDefinitions.values()*.id.join(',')
        }

        gameTestServer {
            type = 'gameTestServer'
            ideName = 'Primal - GameTest Server'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', moduleDefinitions.values()*.id.join(',')
        }

        data {
            data()
            ideName = 'Primal - Data Generation'
            gameDirectory = file('run/data')
            programArguments.addAll(
                    '--mod', moduleDefinitions.values()*.id.join(','),
                    '--all',
                    '--output', file('pack/generated').absolutePath
            )
        }

        configureEach {
            taskBefore preparePrimalModOutputs
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        moduleDefinitions.each { projectPath, moduleDef ->
            "${moduleDef.id}" {
                sourceSet(project(projectPath).sourceSets.main)
            }
        }
    }
}

tasks.named('build').configure {
    dependsOn(primalProjects.collect { "${it.path}:build" })
}

tasks.register('buildAll') {
    group = 'build'
    description = '构建 Primal 工作区的全部自研模组。'
    dependsOn(primalProjects.collect { "${it.path}:build" })
}

tasks.register('collectModJars', Copy) {
    group = 'build'
    description = '构建并收集全部 Primal 模组 JAR 到 build/mods。'
    dependsOn(primalProjects.collect { "${it.path}:jar" })
    primalProjects.each { p ->
        from(p.tasks.named('jar').flatMap { it.archiveFile })
    }
    into(layout.buildDirectory.dir('mods'))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 第三方核心玩法模组、客户端 QoL 下载与源码工作区策略集中在单独脚本维护，
// 避免根 build.gradle 随整合包增长变成依赖清单。
apply from: rootProject.file('gradle/primal-thirdparty.gradle')
